[project]
name = "stratakb"
version = "0.1.0"
description = "Knowledge base over the Model Context Protocol whose answers you can check against exact locations in your documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boudou" }]
requires-python = ">=3.12"
keywords = ["mcp", "rag", "knowledge-base", "pgvector", "hybrid-search", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # MCP framework. 2.x removed mcp.server.fastmcp; see issue #16 before lifting the cap.
    "mcp[cli]>=1.30,<2",
    # Database
    "asyncpg>=0.30.0",
    # Document processing
    "langchain-text-splitters>=0.3.0",
    "pypdf>=6.21.4",
    "pyyaml>=6.0",
    "lxml>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.2.0",
    # Optional LLM query rewriting and OpenAI embeddings
    "anthropic>=0.87.0",
    "openai>=1.50.0",
    # Local embeddings and reranking
    "sentence-transformers>=5.6.0",
    "huggingface-hub>=2.4.0",
    # Logging
    "structlog>=24.0.0",
    # Utils
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cachetools>=7.0.5",
    # Folder selection: .gitignore-style rules
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/boudou/StrataKB"
Issues = "https://github.com/boudou/StrataKB/issues"
Changelog = "https://github.com/boudou/StrataKB/blob/main/CHANGELOG.md"

[project.scripts]
stratakb = "stratakb.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratakb"]
# Ship code only; package notes stay in the source tree
exclude = ["**/*.md"]

# Whitelist, so local files that are not committed never reach the archive
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "db",
    "examples",
    "scripts",
    "docker-compose.yml",
    ".env.example",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = ["src/**/*.md", "db/*.md", "scripts/*.md", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
