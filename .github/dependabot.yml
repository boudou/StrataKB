version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 2.x removed mcp.server.fastmcp; the migration is planned in issue #16
      - dependency-name: mcp
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
