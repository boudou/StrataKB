name: Release

# Push a tag like v0.1.0 to build the wheel and source archive.
# They are attached to a draft release; review it and press Publish on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # The tag must match the version in pyproject.toml
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv build
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* --draft --title "StrataKB ${tag#v}" --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed."
